{% extends "accounts/page.html" %}

{% block account %}
{% if message %}
  <p class="alert">{{ message }}</p>
{% endif %}
{% if reset_url %}
  <p class="lede">Open this link to reset your password. No email was sent.</p>
  <p><a class="confirm-link" href="{{ reset_url }}">{{ reset_url }}</a></p>
{% endif %}
<form class="account-form" method="post" action="{% url 'accounts:password-reset' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  {% include "accounts/_fields.html" %}
  <button type="submit">Reset password</button>
</form>
{% endblock %}
