{% extends "accounts/page.html" %}

{% block account %}
{% if form.non_field_errors %}
  <div class="alert">{{ form.non_field_errors }}</div>
{% endif %}
<form class="account-form" method="post" action="{% url 'accounts:password-reset-confirm' token %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  {% include "accounts/_fields.html" %}
  <button type="submit">Reset password</button>
</form>
{% endblock %}
