[project]
name = "weather-application"
version = "0.1.0"
description = "Server-rendered weather lookup"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6",
    "django-tailwind-cli>=4.4",
    "python-dotenv>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["accounts", "weather", "config", "conftest.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "I001"]
