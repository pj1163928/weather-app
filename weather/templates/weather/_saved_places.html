<div id="saved-places" class="saved-places">
  <p class="saved-label">Places</p>
  {% if favorites %}
  <ul>
    {% for favorite in favorites %}
    <li>
      <a
        href="{{ favorite.open_path }}"
        hx-get="{{ favorite.open_path }}"
        hx-target="#weather"
        hx-swap="outerHTML"
      >
        <span class="saved-name">{{ favorite.display_label }}</span>
        {% if favorite.temperature %}<span class="saved-meta">{{ favorite.temperature }} · {{ favorite.condition|capfirst }}</span>{% endif %}
      </a>
      <form
        method="post"
        action="{% url 'weather:favorite-remove' favorite.pk %}"
        hx-post="{% url 'weather:favorite-remove' favorite.pk %}"
        hx-target="#saved-places"
        hx-swap="outerHTML"
      >
        {% csrf_token %}
        <button type="submit" class="remove-place" aria-label="Remove {{ favorite.display_label }}" title="Remove">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </form>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="saved-empty">No saved places yet.</p>
  {% endif %}
</div>
